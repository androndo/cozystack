apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-system
  labels:
    sharding.fluxcd.io/key: tenants
spec:
  chartRef:
    kind: ExternalArtifact
    name: cozystack-monitoring-application-default-monitoring-system
    namespace: cozy-system
  interval: 5m
  # Aligned with the outer cozyrds `release.cozystack.io/helm-install-timeout: "15m"`
  # (packages/system/monitoring-rd/cozyrds/monitoring.yaml) so the inner HR does
  # not fail at 10m while the OIDC users-Job is still inside its
  # activeDeadlineSeconds: 900 (10m Grafana wait + reconcile budget).
  timeout: 15m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
  - kind: Secret
    name: cozystack-values
  values: {{- .Values | toYaml | nindent 4 }}
